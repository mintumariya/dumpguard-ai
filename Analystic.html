<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DumpGuard AI - Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans">

<!-- Navigation -->
<nav class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-lg">DG</span>
        </div>
        <span class="text-xl font-bold text-gray-800">DumpGuard AI</span>
      </div>
      <div class="hidden md:flex space-x-8">
        <a href="HOME.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Home</a>
        <a href="dashboard.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Dashboard</a>
        <a href="detection.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Live Detection</a>
        <a href="analytics.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Analytics</a>
        <a href="alert.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Alerts</a>
      </div>
      <a href="login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Login</a>
    </div>
  </div>
</nav>

<section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<h2 class="text-3xl font-bold text-center mb-12 text-gray-800">AI Analytics Dashboard</h2>

<!-- Stats Cards -->
<div class="grid md:grid-cols-4 gap-6 mb-12">
  <div class="bg-white p-4 rounded-xl shadow">
    <p class="text-gray-500 text-sm">Total Dogs</p>
    <p class="text-2xl font-bold text-orange-600" id="totalDogs">32</p>
  </div>
  <div class="bg-white p-4 rounded-xl shadow">
    <p class="text-gray-500 text-sm">Total Waste Dumps</p>
    <p class="text-2xl font-bold text-red-600" id="totalWaste">17</p>
  </div>
  <div class="bg-white p-4 rounded-xl shadow">
    <p class="text-gray-500 text-sm">Average Detections/Day</p>
    <p class="text-2xl font-bold text-blue-600" id="avgDetection">7</p>
  </div>
  <div class="bg-white p-4 rounded-xl shadow">
    <p class="text-gray-500 text-sm">Max Detections/Day</p>
    <p class="text-2xl font-bold text-green-600" id="maxDetection">12</p>
  </div>
</div>

<div class="grid md:grid-cols-2 gap-8">

  <!-- Line Chart -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h3 class="text-lg font-semibold mb-4 text-gray-800">Daily Detection Trends</h3>
    <canvas id="lineChart" class="w-full h-48"></canvas>
  </div>

  <!-- Bar Chart: Dog vs Waste -->
  <div class="bg-white p-6 rounded-xl shadow">
    <h3 class="text-lg font-semibold mb-4 text-gray-800">Dog vs Waste Detections</h3>
    <canvas id="barChart" class="w-full h-48"></canvas>
  </div>

  <!-- Doughnut Chart: Weekly Detection -->
  <div class="bg-white p-6 rounded-xl shadow md:col-span-1">
    <h3 class="text-lg font-semibold mb-4 text-gray-800">Weekly Detection Ratio</h3>
    <canvas id="doughnutChart" class="w-full h-48"></canvas>
  </div>

  <!-- Logistic Growth / Predictive Trend -->
  <div class="bg-white p-6 rounded-xl shadow md:col-span-1">
    <h3 class="text-lg font-semibold mb-4 text-gray-800">Logistic Trend (Predictive)</h3>
    <canvas id="logisticChart" class="w-full h-48"></canvas>
  </div>

</div>
</section>

<script>
const detectionDates = ['21 Sep','22 Sep','23 Sep','24 Sep','25 Sep','26 Sep','27 Sep'];
const dogDetections = [5,3,6,2,4,5,7];
const wasteDetections = [2,1,3,2,1,4,2];

// Stats Calculations
const totalDogs = dogDetections.reduce((a,b)=>a+b,0);
const totalWaste = wasteDetections.reduce((a,b)=>a+b,0);
const avgDetection = Math.round((totalDogs+totalWaste)/detectionDates.length);
const maxDetection = Math.max(...dogDetections.map((v,i)=>v + wasteDetections[i]));

document.getElementById('totalDogs').textContent = totalDogs;
document.getElementById('totalWaste').textContent = totalWaste;
document.getElementById('avgDetection').textContent = avgDetection;
document.getElementById('maxDetection').textContent = maxDetection;

// Line Chart
new Chart(document.getElementById('lineChart'), {
  type: 'line',
  data: {
    labels: detectionDates,
    datasets:[
      {label:'Stray Dogs', data:dogDetections, borderColor:'#f97316', backgroundColor:'rgba(249,115,22,0.2)', fill:true, tension:0.4},
      {label:'Waste Dumps', data:wasteDetections, borderColor:'#ef4444', backgroundColor:'rgba(239,68,68,0.2)', fill:true, tension:0.4}
    ]
  },
  options:{responsive:true, plugins:{legend:{position:'top'}, title:{display:true,text:'Detections per Day'}}}
});

// Bar Chart
new Chart(document.getElementById('barChart'), {
  type:'bar',
  data:{
    labels:detectionDates,
    datasets:[
      {label:'Stray Dogs', data:dogDetections, backgroundColor:'#f97316'},
      {label:'Waste Dumps', data:wasteDetections, backgroundColor:'#ef4444'}
    ]
  },
  options:{responsive:true, plugins:{legend:{position:'top'}, title:{display:true,text:'Dog vs Waste Daily'}}}
});

// Doughnut Chart
new Chart(document.getElementById('doughnutChart'), {
  type:'doughnut',
  data:{
    labels:['Stray Dogs','Waste Dumps'],
    datasets:[{
      data:[totalDogs,totalWaste],
      backgroundColor:['#f97316','#ef4444']
    }]
  },
  options:{responsive:true, plugins:{legend:{position:'bottom'}, title:{display:true,text:'Weekly Detection Ratio'}}}
});

// Logistic Trend Simulation
const logisticData = detectionDates.map((_,i)=> Math.round(12/(1+Math.exp(-0.5*(i-3)))));
new Chart(document.getElementById('logisticChart'), {
  type:'line',
  data:{
    labels:detectionDates,
    datasets:[{
      label:'Predicted Detection',
      data:logisticData,
      borderColor:'#3b82f6',
      backgroundColor:'rgba(59,130,246,0.2)',
      fill:true,
      tension:0.4
    }]
  },
  options:{responsive:true, plugins:{legend:{position:'top'}, title:{display:true,text:'Predictive Logistic Trend'}}}
});
</script>
</body>
</html>
