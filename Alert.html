<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DumpGuard AI - Alerts</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

<!-- Navigation -->
<nav class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-lg">DG</span>
        </div>
        <span class="text-xl font-bold text-gray-800">DumpGuard AI</span>
      </div>
      <div class="hidden md:flex space-x-8">
        <a href="HOME.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Home</a>
        <a href="dashboard.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Dashboard</a>
        <a href="detection.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Live Detection</a>
        <a href="analytics.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Analytics</a>
        <a href="alert.html" class="text-gray-700 hover:text-blue-600 font-medium transition-colors">Alerts</a>
      </div>
      <a href="login.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Login</a>
    </div>
  </div>
</nav>

<section class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <h2 class="text-3xl font-bold text-center mb-12 text-gray-800">Real-time AI Alerts</h2>

  <div id="alertsContainer" class="space-y-4">
    <p class="text-gray-500 text-center py-8" id="loadingMessage">Loading alerts from Supabase...</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_KEY';
const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const alertsContainer = document.getElementById('alertsContainer');
const loadingMessage = document.getElementById('loadingMessage');

// Helper to show alerts
function addAlert(alert) {
  const color = alert.type === 'stray_dog' ? 'orange' : 'red';
  const emoji = alert.type === 'stray_dog' ? '🐕' : '🗑';
  const html = `
    <div class="flex items-center justify-between p-4 bg-${color}-50 rounded-lg border-l-4 border-${color}-400">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">${emoji}</span>
        <div>
          <p class="font-medium text-gray-800">${alert.type.replace('_',' ').toUpperCase()}</p>
          <p class="text-sm text-gray-600">${alert.camera_zone} • ${new Date(alert.created_at).toLocaleString()}</p>
        </div>
      </div>
      <button class="bg-${color}-500 text-white px-3 py-1 rounded hover:bg-${color}-600 transition-colors">Action</button>
    </div>
  `;
  alertsContainer.insertAdjacentHTML('afterbegin', html);
}

// Initial fetch
async function fetchAlerts() {
  const { data, error } = await supabase
    .from('detections')
    .select('*')
    .order('created_at',{ascending:false})
    .limit(10);
  
  if (loadingMessage) loadingMessage.remove();
  if (error) {
    alertsContainer.innerHTML = '<p class="text-red-500 text-center py-8">Error loading alerts.</p>';
    console.error(error);
    return;
  }

  data.forEach(addAlert);
}

// Real-time listener
supabase
  .channel('realtime-alerts')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'detections' }, (payload) => {
    addAlert(payload.new);
    showNotification(⚡ New Alert: ${payload.new.type.replace('_',' ')} detected at ${payload.new.camera_zone});
  })
  .subscribe();

// Notification helper
function showNotification(message) {
  const notification = document.createElement('div');
  notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 transform translate-x-full transition-transform';
  notification.textContent = message;
  document.body.appendChild(notification);

  setTimeout(() => { notification.classList.remove('translate-x-full'); }, 100);
  setTimeout(() => {
    notification.classList.add('translate-x-full');
    setTimeout(()=>document.body.removeChild(notification),300);
  }, 3000);
}

document.addEventListener('DOMContentLoaded',()=>{ fetchAlerts(); });
</script>
</body>
</html>
